name: CI
on: [push, pull_request]
env:
  # Pinned upstream commit: no release yet contains `goose format`
  # (it landed 2026-10-25, after v2026.3). Bump to a newer SHA, or back
  # to a release tarball once a release ships the formatter.
  GOOSE_SHA: 0357b1c2e261fa0680008e79d6879f9ccc7aedb9
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --break-system-packages jsonschema
      - run: ./validate.sh
  goose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Goose
        run: |
          git clone https://github.com/aardappel/goose.git /tmp/goose-src
          git -C /tmp/goose-src checkout "${GOOSE_SHA}"
          cmake -S /tmp/goose-src -B /tmp/goose-src/build -DCMAKE_BUILD_TYPE=Release -DGOOSE_BUILTIN_LIBS=none
          cmake --build /tmp/goose-src/build --config Release --parallel
          echo "/tmp/goose-src/build" >> "$GITHUB_PATH"
      - run: goose version
      - run: goose check examples/hello.goose
      - run: goose format --check examples/hello.goose
      - name: Run example
        run: |
          command -v cc || (sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc)
          test "$(goose run examples/hello.goose)" = $'hello, goose\nanswer=42 mask=255\nthe answer\nfor 0 count=1\nfor 1 count=2\nfor 2 count=3\nbang\ndone'
